<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vegan Tycoon</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap">
<style>
:root{--bg:#e9f3e4;--pn:#fff;--tx:#16301f;--mu:#587060;--ac:#2b8a3e;--bd:#cfe0c8;--bad:#c2255c;--f1:#f1e7cf;--f2:#e6dab9;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a12;--pn:#182419;--tx:#e4f1e0;--mu:#97b09b;--ac:#69db7c;--bd:#2a3e2d;--bad:#ff8fb1;--f1:#3a3829;--f2:#32301f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a12;--pn:#182419;--tx:#e4f1e0;--mu:#97b09b;--ac:#69db7c;--bd:#2a3e2d;--bad:#ff8fb1;--f1:#3a3829;--f2:#32301f;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 Fredoka,"Trebuchet MS",system-ui,sans-serif}
#top{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:10px 14px;background:var(--pn);border-bottom:2px solid var(--bd)}
#top b{font-size:20px;color:var(--ac)}#top span{font-weight:600}
#sp{margin-left:auto;display:flex;gap:4px}
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;padding:12px;max-width:1300px;margin:auto}
@media(max-width:900px){main{grid-template-columns:1fr}}
canvas{width:100%;height:auto;background:var(--pn);border:2px solid var(--bd);border-radius:12px;display:block}
aside{background:var(--pn);border:2px solid var(--bd);border-radius:12px;display:flex;flex-direction:column;min-height:320px;max-height:640px}
#tabs{display:flex;border-bottom:2px solid var(--bd)}
#tabs button{flex:1;border:0;background:none;padding:9px 2px;font:inherit;color:var(--mu);cursor:pointer}
#tabs button.on{color:var(--ac);font-weight:600;box-shadow:inset 0 -3px var(--ac)}
#pn{padding:10px;overflow:auto;flex:1}
button{font:inherit;color:var(--tx);background:var(--bg);border:2px solid var(--bd);border-radius:8px;padding:5px 9px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--ac)}button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:3px solid var(--ac);outline-offset:1px}
button.on{background:var(--ac);color:var(--pn);border-color:var(--ac)}
.it{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--bd)}.it>div{flex:1}
small{color:var(--mu)}
.pg{height:6px;background:var(--bd);border-radius:3px;margin-top:4px;overflow:hidden}.pg i{display:block;height:100%}
#lg{padding:0 14px 12px;max-width:1300px;margin:auto;color:var(--mu);min-height:3.6em}
#ov{display:none;position:fixed;inset:0;background:#0009;align-items:center;justify-content:center;padding:16px;z-index:9}
#ov>div{background:var(--pn);padding:20px;border-radius:14px;max-width:420px;border:2px solid var(--ac)}
#ovB{display:flex;flex-direction:column;gap:6px}
h3{margin:10px 0 4px}
</style></head><body>
<div id="top"><b>🌱 Vegan Tycoon</b><span id="sM"></span><span id="sD"></span><span id="sR"></span><span id="sB"></span><span id="sE"></span>
<div id="sp"><button id="b0" onclick="spd(0)" aria-label="Pausar">⏸</button><button id="b1" onclick="spd(1)" aria-label="Velocidade normal">▶</button><button id="b3" onclick="spd(3)" aria-label="Velocidade rápida">⏩</button></div></div>
<main><canvas id="cv" width="900" height="520"></canvas>
<aside><nav id="tabs"></nav><div id="pn"></div></aside></main>
<div id="lg"></div>
<div id="ov"><div><h2 id="ovT" style="margin-top:0"></h2><p id="ovP"></p><div id="ovB"></div></div></div>
<script>
const $=id=>document.getElementById(id);
const SZ=[8,10,12,14,14,14],TW=32,TH=16,OX=450,OY=70;
const BLD=[{n:'Barraca de feira',rent:10,cost:0},{n:'Cantina',rent:25,cost:4000},{n:'Restaurante',rent:60,cost:12000},{n:'Casa de rede',rent:120,cost:30000},{n:'Polo gastronômico',rent:220,cost:70000},{n:'Império vegano',rent:400,cost:150000}];
const TL={desk:{n:'Bancada',c:250,e:'🔪'},stove:{n:'Fogão',c:600,e:'🔥'},juice:{n:'Suco prensado',c:150,e:'🥤'},plant:{n:'Planta',c:60,e:'🪴'},sofa:{n:'Sofá',c:300,e:'🛋️'},hammock:{n:'Rede',c:500,e:'🛌'},del:{n:'Remover',c:0,e:'🗑️'}};
const AM={juice:[4,3],plant:[2,3],sofa:[3,3],hammock:[5,4]};
const RO={chef:{n:'Chef',c:'#2b8a3e',e:'🧑‍🍳',p:1,u:0},conf:{n:'Confeiteiro',c:'#d6336c',e:'🧁',p:1,u:0},bar:{n:'Barista',c:'#1c7ed6',e:'🥤',p:1,u:0},nutri:{n:'Nutricionista',c:'#f59f00',e:'🥗',u:1.5},ger:{n:'Gerente',c:'#7048e8',e:'📋',u:2},mkt:{n:'Marketing',c:'#0ca678',e:'📣',u:3}};
const TR={fast:'⚡ Veloz',java:'🥤 Sedento',calm:'🧘 Calmo'};
const SEC=[['Marmitas',.8,0,['chef']],['Feira orgânica',1,0,['chef','conf']],['Café corporativo',1.3,1.5,['chef','bar']],['Casamento vegano',1.8,3,['chef','conf','bar']],['Festival',2.4,4.5,['chef','conf','bar']],['Hotel 5 estrelas',3,6,['chef','conf','bar']]];
const CL=['Pão de grão-de-bico','Hambúrguer de jaca','Bolo sem leite','Poke de tofu','Feijoada vegana','Marmita fit','Brigadeiro de tâmara','Moqueca de palmito'];
const NM=['Ana','Bruno','Carla','Diego','Elisa','Fábio','Gabi','Hugo','Iara','João','Lia','Marcos','Nina','Otto'];
const UP={chair:['Cadeiras ergonômicas','Humor cai 40% menos',1500],juice:['Sucos premium','Suco dá +50% de humor',1200],knife:['Facas afiadas','+15% de produção',2500],cloud:['Fogões industriais','Cada fogão atende 5 pessoas',3000],recipe:['Receitas testadas','+20% de produção',5000],ac:['Ar-condicionado','+2 de humor por dia',900],mkt:['Divulgação','Pedidos pagam +10%',3000],seal:['Selo sanitário','Imune à fiscalização',2000]};
const R=(a,b)=>a+Math.random()*(b-a),pick=a=>a[0|Math.random()*a.length],n$=v=>(v<0?'-':'')+'$'+Math.abs(Math.round(v)).toLocaleString('pt-BR');
const fresh=()=>({money:6000,day:1,rep:1,lvl:0,tiles:{'2,2':'desk','4,2':'desk','6,2':'stove','3,4':'juice'},emps:[{id:1,n:'Ana',role:'chef',sk:5,lvl:1,xp:0,mood:85,tr:'calm',sal:40,desk:'2,2',x:2,y:2}],cands:[],off:[],act:[],up:{},log:['Bem-vindo! Monte bancadas, contrate a equipe e aceite pedidos.'],down:{},id:2,done:0,goal:40000,rev:0,exp:0});
let G;try{G=JSON.parse(localStorage.getItem('vt1'))||fresh()}catch(e){G=fresh()}
let tool='desk',tab='ped',sp=1,acc=0,hov=null;
const log=t=>{G.log.unshift('Dia '+G.day+': '+t);G.log=G.log.slice(0,4)};
const save=()=>{try{localStorage.setItem('vt1',JSON.stringify(G))}catch(e){}};
const desks=()=>Object.values(G.tiles).filter(t=>t==='desk').length;
const rc=r=>G.emps.filter(x=>x.role===r).length;
function genC(){const L=Object.keys(RO).filter(r=>G.rep>=RO[r].u),r=pick([...L,'chef','conf','bar']),sk=Math.max(3,Math.round(R(3,6)+G.rep*.4)),sal=Math.round((18+sk*5)*(1+G.day/500));return{id:G.id++,n:pick(NM),role:r,sk,tr:pick(Object.keys(TR)),sal,cost:sal*8}}
function genO(){const sc=pick(SEC.filter(s=>G.rep>=s[2])),m=(1+G.rep*.2)*(1+G.day/400),need={};let w=0;sc[3].forEach(r=>{need[r]=Math.round(R(18,40)*m);w+=need[r]});
return{id:G.id++,name:sc[0]+': '+pick(CL),need,tot:{...need},reward:Math.round(w*(R(15,20)+G.rep*2)*sc[1]*(G.up.mkt?1.1:1)/10)*10,dl:Math.round(w/(sc[3].length*3.5)+12),exp:14}}
function fill(){while(G.cands.length<6)G.cands.push(genC());while(G.off.length<3)G.off.push(genO())}
function assign(e){if(e.desk&&G.tiles[e.desk]==='desk')return;e.desk=Object.keys(G.tiles).find(p=>G.tiles[p]==='desk'&&!G.emps.some(o=>o.desk===p))||null}
function near(e,t,r){for(const p in G.tiles)if(G.tiles[p]===t){const[a,b]=p.split(',');if(Math.hypot(a-e.x,b-e.y)<=r)return 1}return 0}
function amen(e){let b=null,d=99;for(const p in G.tiles)if(AM[G.tiles[p]]){const[x,y]=p.split(',').map(Number),h=Math.hypot(x-e.x,y-e.y);if(h<d){d=h;b={x,y}}}return b}
function load(){const s=Object.keys(G.tiles).reduce((a,p)=>a+(G.tiles[p]==='stove'&&!G.down[p]?1:0),0)*(G.up.cloud?5:3);return G.emps.length?(s?Math.min(1,s/G.emps.length):.3):1}
function tick(){
G.day++;const ra=load(),pm=1+Math.min(3,rc('ger'))*.08;
for(const e of G.emps){assign(e);
 if(e.brk){if(--e.brk.t<=0)delete e.brk}else if(e.mood<48&&Math.random()<.7){const a=amen(e);if(a)e.brk={x:a.x,y:a.y,t:2}}
 let up=0;for(const t in AM)if(near(e,t,AM[t][1]))up+=AM[t][0]*(t==='juice'?(G.up.juice?1.5:1)*(e.tr==='java'?1.5:1):1);
 e.mood=Math.max(0,Math.min(100,e.mood-(e.cr?8:0)-3*(G.up.chair?.6:1)*(e.tr==='calm'?.5:1)+up+(G.up.ac?2:0)));
 if(RO[e.role].p&&e.desk&&!e.brk){
  const o=e.sk*(.4+.6*e.mood/100)*ra*(e.tr==='fast'?1.2:1)*(G.up.knife?1.15:1)*(G.up.recipe?1.2:1)*(e.cr?1.4:1)*pm,cs=G.act.filter(c=>c.need[e.role]>0);
  cs.forEach(c=>c.need[e.role]=Math.max(0,c.need[e.role]-o/cs.length));e.xp+=o;
  if(e.xp>=e.lvl*45){e.xp=0;e.lvl++;e.sk++;e.sal+=5;log('⬆️ '+e.n+' subiu para o nível '+e.lvl+'!')}}}
G.emps.forEach(e=>{if(e.sal<(18+e.sk*5)*(1+G.day/500)*.85&&Math.random()<.08){e.mood=0;log('💼 '+e.n+' recebeu uma oferta melhor e saiu!')}});
G.emps.filter(e=>e.mood<10&&e.mood>0).forEach(e=>log('😡 '+e.n+' pediu demissão!'));G.emps=G.emps.filter(e=>e.mood>=10);
for(const c of [...G.act]){c.dl--;
 if(Object.values(c.need).every(v=>v<=0)){const bug=Math.random()<Math.max(.03,.25-rc('nutri')*.08),rw=Math.round(c.reward*(bug?.75:1));G.money+=rw;G.rev+=rw;G.rep+=.4;G.done++;
  log(bug?'😕 Cliente reclamou de '+c.name+': pagamento -25%':'✅ Entregue: '+c.name+' (+'+n$(rw)+')');if(bug)G.rep=Math.max(0,G.rep-.25);G.act=G.act.filter(x=>x!==c)}
 else if(c.dl<=0){const p=Math.round(c.reward*.25*(1+G.day/400));G.money-=p;G.exp+=p;G.rep=Math.max(G.day<45?1:0,G.rep-.6);log('❌ Prazo estourou: '+c.name+' (-'+n$(p)+')');G.act=G.act.filter(x=>x!==c)}}
G.off.forEach(o=>o.exp--);G.off=G.off.filter(o=>o.exp>0);
if(G.off.length<5+Math.min(3,rc('mkt'))&&Math.random()<.35+.08*Math.min(3,rc('mkt')))G.off.push(genO());
if(G.day%5===0)G.cands=[];
const ex=G.emps.reduce((s,e)=>s+e.sal,0)+BLD[G.lvl].rent;G.money-=ex;G.exp+=ex;
if(G.day%30===0){const pr=G.rev-G.exp;if(pr>0){const t=Math.round(pr*.08);G.money-=t;log('🧾 Impostos do mês: -'+n$(t))}G.rev=0;G.exp=0}
for(const p in G.down)if(--G.down[p]<=0)delete G.down[p];
fill();
if(G.money>=G.goal){const g=G.goal;G.goal*=3;save();return modal('🏆 Meta batida!','Seu negócio chegou a '+n$(g)+' no dia '+G.day+'. A próxima meta é '+n$(G.goal)+'.',[['Continuar']])}
if(G.money<-2000){return modal('💀 Falência','O restaurante fechou no dia '+G.day+'.',[['Jogar de novo',reset]])}
if(Math.random()<.12+Math.min(.1,G.day/2500))evt();
save();ui()}
function evt(){let r=0|Math.random()*4;const st=Object.keys(G.tiles).filter(p=>G.tiles[p]==='stove');if((r===1&&G.up.seal)||(r===3&&!st.length))r=0;
if(r===0)modal('📨 Pedido extra','Um cliente quer mais pratos sem aumentar o prazo.',[['Aceitar: +$600, equipe -10 de humor',()=>{G.money+=600;G.emps.forEach(x=>x.mood-=10)}],['Recusar: -0,2 de reputação',()=>G.rep=Math.max(0,G.rep-.2)]]);
else if(r===1)modal('🕵️ Fiscalização sanitária','Os fiscais chegaram de surpresa.',[['Pagar adequações ($500)',()=>G.money-=500],['Arriscar (50%: multa de $1.500)',()=>{if(Math.random()<.5){G.money-=1500;log('Multa sanitária! -$1.500')}}]]);
else if(r===2)modal('📰 Crítico gastronômico','Uma crítica quer provar o cardápio.',[['Receber de graça (-$200)',()=>{G.money-=200;G.rep+=Math.random()<.7?.5:-.3}],['Recusar',()=>{}]]);
else{G.down[pick(st)]=4;log('🔥 Um fogão quebrou por 4 dias!')}}
function modal(t,p,o){$('ov').style.display='flex';$('ovT').textContent=t;$('ovP').textContent=p;const b=$('ovB');b.innerHTML='';o.forEach(([l,f])=>{const x=document.createElement('button');x.textContent=l;x.onclick=()=>{$('ov').style.display='none';f&&f();ui()};b.appendChild(x)})}
function reset(){try{localStorage.removeItem('vt1')}catch(e){}G=fresh();fill();ui()}
function spd(s){sp=s;[0,1,3].forEach(i=>$('b'+i).className=i===s?'on':'')}
const pk=t=>{tool=t;ui()},tg=t=>{tab=t;ui()};
function hire(i){const c=G.cands[i];if(!c||G.money<c.cost)return;G.money-=c.cost;G.cands.splice(i,1);G.emps.push({id:c.id,n:c.n,role:c.role,sk:c.sk,lvl:1,xp:0,mood:80,tr:c.tr,sal:c.sal,desk:null,x:0,y:0});assign(G.emps.at(-1));log(c.n+' entrou na equipe!');ui()}
function accept(id){if(G.act.length>=3)return log('Máximo de 3 pedidos ativos.'),ui();const o=G.off.find(x=>x.id===id);G.off=G.off.filter(x=>x!==o);G.act.push(o);ui()}
function buy(u){const c=UP[u][2];if(G.money<c||G.up[u])return;G.money-=c;G.up[u]=1;ui()}
function expand(){const nb=BLD[G.lvl+1];if(!nb||G.money<nb.cost)return;G.money-=nb.cost;G.lvl++;log('🏗️ Agora você tem: '+nb.n+'!');ui()}
function ui(){
$('sM').textContent=n$(G.money);$('sM').style.color=G.money<0?'var(--bad)':'';$('sD').textContent='Dia '+G.day;$('sR').textContent='⭐'+G.rep.toFixed(1);$('sB').textContent=BLD[G.lvl].n;$('sE').textContent='👥 '+G.emps.length+'/'+desks()+' bancadas';
$('lg').innerHTML=G.log.slice(0,3).join('<br>')+'<br><small>Custo por dia: '+n$(G.emps.reduce((s,e)=>s+e.sal,0)+BLD[G.lvl].rent)+' · meta: '+n$(G.goal)+'</small>';
const T=[['ped','Pedidos'],['hire','Contratar'],['team','Equipe'],['shop','Loja'],['obra','Obra']];
$('tabs').innerHTML=T.map(([i,t])=>`<button class="${i===tab?'on':''}" onclick="tg('${i}')">${t}</button>`).join('');
let h='';
if(tab==='ped')h=`<h3>Ativos (${G.act.length}/3)</h3>`+(G.act.map(c=>`<div class="it"><div><b>${c.name}</b> <small>${n$(c.reward)} · ${c.dl}d</small>${Object.keys(c.tot).map(r=>`<div class="pg"><i style="width:${100-c.need[r]/c.tot[r]*100}%;background:${RO[r].c}"></i></div>`).join('')}</div></div>`).join('')||'<small>Nenhum pedido ativo. Aceite um abaixo.</small>')+'<h3>Propostas</h3>'+G.off.map(o=>`<div class="it"><div><b>${o.name}</b><br><small>${Object.keys(o.tot).map(r=>RO[r].e+Math.round(o.tot[r])+(rc(r)?'':'❗')).join(' ')} · prazo ${o.dl}d · expira em ${o.exp}d</small></div><button onclick="accept(${o.id})">${n$(o.reward)}</button></div>`).join('');
else if(tab==='hire')h=`<small>Os candidatos renovam a cada 5 dias. Cada cozinheiro precisa de uma bancada. Novos cargos liberam com reputação.</small><br><button onclick="if(G.money>=200){G.money-=200;G.cands=[];fill();ui()}">🔄 Headhunter $200</button>`+G.cands.map((c,i)=>`<div class="it"><div>${RO[c.role].e} <b>${c.n}</b> · ${RO[c.role].n}<br><small>Skill ${c.sk} · ${TR[c.tr]} · ${n$(c.sal)}/dia</small></div><button ${G.money<c.cost?'disabled':''} onclick="hire(${i})">${n$(c.cost)}</button></div>`).join('');
else if(tab==='team')h=G.emps.map((e,i)=>`<div class="it"><div>${RO[e.role].e} <b>${e.n}</b> <small>Nv${e.lvl} · skill ${e.sk} · ${TR[e.tr]} · ${n$(e.sal)}/dia${e.brk?' · em pausa':e.desk?'':' · sem bancada!'}</small><div class="pg"><i style="width:${e.mood}%;background:${e.mood>50?'#2b8a3e':e.mood>25?'#f59f00':'#c2255c'}"></i></div></div><button onclick="G.emps[${i}].cr=!G.emps[${i}].cr;ui()">${e.cr?'🔥 Correria':'💤 Normal'}</button><button onclick="const q=G.emps[${i}];if(G.money>=100){q.sal=Math.round(q.sal*1.15);q.mood=Math.min(100,q.mood+15);G.money-=100;ui()}">💰+15%</button><button onclick="G.emps.splice(${i},1);ui()">✖</button></div>`).join('')||'<small>Ninguém na equipe. Contrate alguém!</small>';
else if(tab==='shop')h=Object.entries(UP).map(([u,x])=>`<div class="it"><div><b>${x[0]}</b><br><small>${x[1]}</small></div><button ${G.up[u]||G.money<x[2]?'disabled':''} onclick="buy('${u}')">${G.up[u]?'✔':n$(x[2])}</button></div>`).join('');
else{const nb=BLD[G.lvl+1];h='<small>Escolha o item e clique numa casa do salão.</small><br>'+Object.entries(TL).map(([i,t])=>`<button class="${i===tool?'on':''}" onclick="pk('${i}')">${t.e} ${t.n}${t.c?' '+n$(t.c):''}</button>`).join(' ')+(nb?`<div class="it"><div><b>🏗️ ${nb.n}</b><br><small>Salão ${SZ[G.lvl+1]}x${SZ[G.lvl+1]} · aluguel ${n$(nb.rent)}/dia</small></div><button ${G.money<nb.cost?'disabled':''} onclick="expand()">${n$(nb.cost)}</button></div>`:'')+'<br><br><button onclick="if(confirm(\'Apagar o progresso e recomeçar?\'))reset()">Recomeçar do zero</button>'}
$('pn').innerHTML=h}
/* ---- Desenho. ATLAS/SPR: quando a arte final chegar, preencha SPR[nome]=[x,y,w,h,ancoraX,ancoraY] e ATLAS.src ---- */
const ATLAS=new Image(),SPR={},cv=$('cv'),cx=cv.getContext('2d');
function spr(n,px,py){const s=SPR[n];if(!s||!ATLAS.naturalWidth)return 0;cx.imageSmoothingEnabled=false;cx.drawImage(ATLAS,s[0],s[1],s[2],s[3],px-s[4],py-s[5],s[2],s[3]);return 1}
const P=(a,b)=>[OX+(a-b)*TW,OY+(a+b)*TH];
function poly(p,c){cx.beginPath();p.forEach(([x,y],i)=>i?cx.lineTo(x,y):cx.moveTo(x,y));cx.closePath();cx.fillStyle=c;cx.fill()}
function box(x,y,i,h,c,z=0){const x0=x+i,x1=x+1-i,y0=y+i,y1=y+1-i,L=(q,d)=>[q[0],q[1]-d],A=P(x0,y0),B=P(x1,y0),C=P(x1,y1),D=P(x0,y1);poly([L(D,z),L(C,z),L(C,z+h),L(D,z+h)],c[1]);poly([L(B,z),L(C,z),L(C,z+h),L(B,z+h)],c[2]);poly([L(A,z+h),L(B,z+h),L(C,z+h),L(D,z+h)],c[0])}
function em(t,x,y,s){cx.font=s+'px serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(t,x,y)}
function pos(ev){const r=cv.getBoundingClientRect(),px=(ev.clientX-r.left)/r.width*900,py=(ev.clientY-r.top)/r.height*520,dx=(px-OX)/TW,dy=(py-OY)/TH;return[Math.floor((dx+dy)/2),Math.floor((dy-dx)/2)]}
cv.addEventListener('mousemove',e=>hov=pos(e));cv.addEventListener('mouseleave',()=>hov=null);
cv.addEventListener('click',ev=>{const[x,y]=pos(ev),p=x+','+y,n=SZ[G.lvl];if(x<0||y<0||x>=n||y>=n||(x===0&&y===0))return;
if(tool==='del'){const t=G.tiles[p];if(t){G.money+=TL[t].c/2;delete G.tiles[p];G.emps.forEach(assign)}}
else if(!G.tiles[p]){if(G.money<TL[tool].c)return log('Sem caixa!'),ui();G.money-=TL[tool].c;G.tiles[p]=tool;G.emps.forEach(assign)}
ui()});
function draw(tm){
const css=getComputedStyle(document.documentElement),a=css.getPropertyValue('--f1').trim(),b=css.getPropertyValue('--f2').trim(),n=SZ[G.lvl];
cx.clearRect(0,0,900,520);
for(let y=0;y<14;y++)for(let x=0;x<14;x++){const ok=x<n&&y<n;poly([P(x,y),P(x+1,y),P(x+1,y+1),P(x,y+1)],ok?((x+y)%2?a:b):'rgba(0,0,0,.12)')}
if(hov&&hov[0]>=0&&hov[1]>=0&&hov[0]<n&&hov[1]<n)poly([P(hov[0],hov[1]),P(hov[0]+1,hov[1]),P(hov[0]+1,hov[1]+1),P(hov[0],hov[1]+1)],'rgba(43,138,62,.35)');
const it=[];
for(const p in G.tiles){const[x,y]=p.split(',').map(Number),t=G.tiles[p];it.push([x+y,()=>{const c=P(x+.5,y+.5);if(spr(t,c[0],c[1]+TH/2))return;
 if(t==='desk'){box(x,y,.08,9,['#d9b98a','#b8935f','#9a7a4a']);box(x,y,.3,5,['#8ce99a','#2b8a3e','#237a35'],9)}
 else if(t==='stove'){const d=G.down[p];box(x,y,.15,30,['#868e96','#495057','#343a40']);cx.fillStyle=d?'#c2255c':'#ff922b';for(let i=0;i<3;i++)cx.fillRect(c[0]-9+i*7,c[1]-22+i*7,4,3);if(d)em('💥',c[0],c[1]-40+Math.sin(tm/150)*2,22)}
 else if(t==='juice'){box(x,y,.3,12,['#ffa94d','#e8590c','#bf4a0a']);em('🥤',c[0],c[1]-22,18)}
 else if(t==='sofa')box(x,y,.1,12,['#f783ac','#d6336c','#a61e4d']);
 else if(t==='hammock'){box(x,y,.15,6,['#74c0fc','#339af0','#1c7ed6'],8);em('🛌',c[0],c[1]-14,18)}
 else em('🪴',c[0],c[1]-6,28)}])}
for(const e of G.emps){let tx=0,ty=0;if(e.brk){tx=e.brk.x;ty=e.brk.y}else if(e.desk){[tx,ty]=e.desk.split(',').map(Number)}
 e.x+=Math.max(-.04,Math.min(.04,tx-e.x));e.y+=Math.max(-.04,Math.min(.04,ty-e.y));const mv=Math.hypot(tx-e.x,ty-e.y)>.05;
 it.push([e.x+e.y+.6,()=>{const c=P(e.x+.5,e.y+.5),by=mv?Math.abs(Math.sin(tm/110+e.id))*3:0,y0=c[1]-(mv?2:6)-by;
 cx.fillStyle='rgba(0,0,0,.25)';cx.beginPath();cx.ellipse(c[0],c[1]+2,9,4,0,0,7);cx.fill();
 cx.fillStyle=RO[e.role].c;cx.fillRect(c[0]-6,y0-16,12,16);cx.fillStyle='#f1c9a5';cx.beginPath();cx.arc(c[0],y0-21,6,0,7);cx.fill();
 if(e.role==='chef'||e.role==='conf'){cx.fillStyle='#fff';cx.fillRect(c[0]-5,y0-31,10,6)}
 cx.fillStyle='#0006';cx.fillRect(c[0]-10,y0-36,20,3);cx.fillStyle=e.mood>50?'#2b8a3e':e.mood>25?'#f59f00':'#c2255c';cx.fillRect(c[0]-10,y0-36,20*e.mood/100,3);
 const bb=!e.desk&&RO[e.role].p?'🪑':e.brk?'💤':load()<1&&RO[e.role].p?'🐌':e.mood<35?'😤':'';if(bb)em(bb,c[0]+14,y0-38,16)}])}
it.sort((p,q)=>p[0]-q[0]).forEach(i=>i[1]());
em('🚪',P(.5,.5)[0],P(.5,.5)[1]-6,22)}
let last=0;
function loop(t){const dt=Math.min(100,t-last);last=t;if($('ov').style.display!=='flex'){acc+=dt*sp;if(acc>=1500){acc=0;tick()}}draw(t);requestAnimationFrame(loop)}
fill();spd(1);ui();requestAnimationFrame(loop);
</script></body></html>
